<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Thiên Đường Ảo — Bản thử nghiệm</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui,Arial;background:#142637;color:#fff}canvas{display:block;touch-action:none}#hud{position:fixed;top:9px;left:9px;z-index:4;background:#071b2ba8;border:1px solid #ffffff38;border-radius:15px;padding:9px 12px;max-width:min(290px,calc(100vw - 24px));backdrop-filter:blur(10px);font-size:12px;line-height:1.45}#hud strong{font-size:17px}#hud .small{font-size:11px;color:#b9d5e7}button{border:0;border-radius:12px;padding:10px 9px;background:#ffffffdc;color:#17374a;font-weight:700;cursor:pointer}#actions{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;white-space:nowrap}#touch{position:fixed;bottom:90px;left:16px;z-index:5;display:grid;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,43px);gap:4px;opacity:.82}#touch button{padding:0;font-size:21px}#touch .empty{visibility:hidden}#notice{position:fixed;right:12px;top:12px;display:none;background:#071b2bc7;padding:9px 12px;border-radius:12px;font-size:12px;max-width:210px;z-index:4}#help{position:fixed;bottom:85px;right:12px;display:none;background:#071b2bc0;border-radius:12px;padding:8px 11px;font-size:12px;max-width:230px;z-index:4}@media(max-width:650px){#help{bottom:145px;font-size:11px;max-width:155px}#notice{top:auto;bottom:135px;max-width:160px;font-size:11px}#hud{font-size:12px}}
</style></head><body><div id="hud"><strong>🌺 THIÊN ĐƯỜNG ẢO 0.2</strong><br><span id="clock">Giờ Hà Nội: ...</span><br><span id="weather">Thời tiết: đang tải...</span><br><span id="online">Khách đang ở đảo: 1 (bản thử nghiệm)</span><div class="small">Vườn địa đàng • người chơi khác hiện là mô phỏng</div></div><div id="notice">🌴 Chào mừng đến đảo Thiên Đường!</div><div id="help">Vuốt trên cảnh để xoay góc nhìn • ▲▼◀▶ để đi bộ</div><div id="touch"><span class="empty"></span><button data-key="ArrowUp">▲</button><span class="empty"></span><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><div id="actions"><button id="view">📷 Góc nhìn</button><button id="weatherBtn">🌦 Thời tiết</button><button id="friend">❤️ Bạn ảo</button></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const scene=new THREE.Scene();const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);const ambient=new THREE.HemisphereLight(0xdff6ff,0x6e744c,2);scene.add(ambient);const sun=new THREE.DirectionalLight(0xffe7b3,3);sun.position.set(-25,45,-20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-80;sun.shadow.camera.right=80;sun.shadow.camera.top=80;sun.shadow.camera.bottom=-80;scene.add(sun);
const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const sand=mat('#f4dfa5'),grass=mat('#64a663'),water= new THREE.MeshStandardMaterial({color:'#2bacc2',transparent:true,opacity:.8,metalness:.1,roughness:.25}),wood=mat('#7c4d35'),leaf=mat('#1e915c'),rock=mat('#777b79');const geo=(g,m,x,y,z,rx=0,ry=0,rz=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.rotation.set(rx,ry,rz);o.receiveShadow=true;o.castShadow=true;scene.add(o);return o};
// Đảo thiên đường: hình khối nhẹ để chạy trên điện thoại
geo(new THREE.PlaneGeometry(600,600),water,0,-.45,0,-Math.PI/2);
const island=geo(new THREE.CylinderGeometry(48,51,2,96),sand,0,-1.15,0);
const lawn=geo(new THREE.CylinderGeometry(29,31,.28,80),grass,0,-.03,-7);
const pathMat=mat('#eacda0');geo(new THREE.PlaneGeometry(5.5,58),pathMat,0,.14,0,-Math.PI/2);
// Bãi biển, đá ven bờ, những bông hoa và hàng dừa
const palmLeaf=mat('#2eae75'),palmDark=mat('#16885d'),bark=mat('#956343'),pink=mat('#f65eab'),violet=mat('#b88dfb'),yellow=mat('#ffd875');
function palm(x,z,h=7){const trunk=new THREE.Group();trunk.position.set(x,0,z);scene.add(trunk);for(let j=0;j<6;j++){let t=new THREE.Mesh(new THREE.CylinderGeometry(.18-j*.014,.27-j*.014,h/6,8),bark);t.position.set(j*.075,(j+.5)*h/6,0);t.rotation.z=-.11;trunk.add(t)}let tx=x+.46,ty=h,tz=z;for(let i=0;i<9;i++){const a=i*Math.PI*2/9;const leaf=new THREE.Mesh(new THREE.ConeGeometry(.65,5.5,5),i%2?palmLeaf:palmDark);leaf.position.set(tx+Math.cos(a)*2.15,ty-.35,tz+Math.sin(a)*2.15);leaf.rotation.z=Math.PI/2;leaf.rotation.y=-a;scene.add(leaf)}for(let k=0;k<3;k++){const c=new THREE.Mesh(new THREE.SphereGeometry(.27,8,6),bark);c.position.set(tx+Math.cos(k*2.1)*.35,ty-.25,tz+Math.sin(k*2.1)*.35);scene.add(c)}}
for(let i=0;i<18;i++){const a=i*2.399,r=24+(i%4)*5,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<5&&z>-23&&z<30)continue;palm(x,z,6+(i%4)*.7)}
for(let i=0;i<26;i++){let a=i*2.4,r=14+(i%5)*4;const x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<4&&z>-26&&z<26)continue;geo(new THREE.DodecahedronGeometry(.35+(i%4)*.17),rock,x,.28,z)}
// Hồ nước trong, đảo nhỏ và thác nước kỳ ảo
const pool=geo(new THREE.CylinderGeometry(9,9,.08,48),new THREE.MeshStandardMaterial({color:'#4bd8da',metalness:.18,roughness:.16}),-19,.17,-15);
const waterfall=geo(new THREE.PlaneGeometry(6,10),new THREE.MeshBasicMaterial({color:'#80edff',transparent:true,opacity:.8,side:THREE.DoubleSide}),-27,5,-25,0,.2,0);
for(let j=0;j<5;j++)geo(new THREE.DodecahedronGeometry(3.5-j*.4),rock,-27+j*.9,1.3+j*1.1,-28-j*.4);
// Cầu gỗ ngang hồ
for(let i=0;i<10;i++){geo(new THREE.BoxGeometry(1.35,.18,4.5),wood,-25+i*1.3,.7,-14)}
for(const side of [-1,1]){for(let i=0;i<6;i++)geo(new THREE.CylinderGeometry(.09,.09,1.1,6),wood,-25+i*2.5,1.15,-14+side*2.1)}
// Vòm hoa ở cuối đường
for(let j=0;j<2;j++)geo(new THREE.CylinderGeometry(.18,.18,5,8),wood,-2.7+j*5.4,2.5,-24);
geo(new THREE.TorusGeometry(2.8,.2,8,24,Math.PI),pink,0,5,-24);
// Vườn hoa nhỏ, có ánh đèn lấp lánh ban đêm
const flowerMats=[pink,violet,yellow,mat('#ff9f8d')];const glow=[];
for(let i=0;i<170;i++){const a=i*2.399,r=8+(i%16)*1.12,x=Math.cos(a)*r,z=Math.sin(a)*r-5;if(Math.abs(x)<4.3&&z>-27&&z<29)continue;geo(new THREE.CylinderGeometry(.028,.035,.38,5),leaf,x,.33,z);const f=geo(new THREE.IcosahedronGeometry(.14+(i%3)*.03,0),flowerMats[i%4],x,.57,z);if(i%11===0){const g=new THREE.PointLight('#ffe7b5',.45,5);g.position.set(x,1,z);scene.add(g);glow.push(g)}}
// Băng ghế và đèn đường
for(const z of [-18,-5,11,23]){geo(new THREE.BoxGeometry(2.7,.18,.75),wood,5.9,.82,z);geo(new THREE.BoxGeometry(2.7,.95,.15),wood,5.9,1.35,z+.38);for(const x of [4.8,7])geo(new THREE.BoxGeometry(.14,.75,.14),bark,x,.4,z)}
const lanterns=[];for(const z of [-20,-7,8,22]){for(const x of [-4.2,4.2]){geo(new THREE.CylinderGeometry(.07,.1,3.8,8),bark,x,1.9,z);geo(new THREE.SphereGeometry(.33,12,10),yellow,x,3.95,z);const l=new THREE.PointLight('#ffdc93',1.2,13);l.position.set(x,3.7,z);scene.add(l);lanterns.push(l)}}
// Thân người có tay, chân, tóc, trang phục và hoạt hình bước đi
function avatar(color,x,z){const root=new THREE.Group();root.position.set(x,.12,z);scene.add(root);const shirt=mat(color),skin=mat('#edb68f'),pants=mat('#364e6c'),shoes=mat('#e8e5e2');const body=new THREE.Mesh(new THREE.CylinderGeometry(.43,.37,1.15,12),shirt);body.position.y=1.55;root.add(body);const neck=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.23,8),skin);neck.position.y=2.22;root.add(neck);const head=new THREE.Mesh(new THREE.SphereGeometry(.39,20,16),skin);head.scale.set(.9,1.12,.86);head.position.y=2.62;root.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.41,16,12,0,Math.PI*2,0,Math.PI*.54),mat('#28212a'));hair.position.y=2.69;root.add(hair);const eyes=mat('#292f3b');for(const ex of [-.14,.14]){const e=new THREE.Mesh(new THREE.SphereGeometry(.036,8,8),eyes);e.position.set(ex,2.67,.33);root.add(e)}const arms=[],legs=[];for(const s of [-1,1]){const arm=new THREE.Group();arm.position.set(s*.49,2.02,0);const a=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.75,4,8),skin);a.position.y=-.43;arm.add(a);root.add(arm);arms.push(arm);const leg=new THREE.Group();leg.position.set(s*.21,1.03,0);const l=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.73,4,8),pants);l.position.y=-.49;leg.add(l);const foot=new THREE.Mesh(new THREE.BoxGeometry(.32,.18,.53),shoes);foot.position.set(0,-.98,.14);leg.add(foot);root.add(leg);legs.push(leg)}return {root,legs,arms}}
const player=avatar('#f2f0e6',0,7),companion=avatar('#f28bb4',4,3);let friendVisible=false;companion.root.visible=false;
const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key);if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key));document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(b.dataset.key);b.setPointerCapture(e.pointerId)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>keys.delete(b.dataset.key))});let camAngle=0,firstPerson=false,drag=false,oldX=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;oldX=e.clientX});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(drag){camAngle-=(e.clientX-oldX)*.006;oldX=e.clientX}});document.getElementById('view').onclick=()=>firstPerson=!firstPerson;document.getElementById('friend').onclick=()=>{friendVisible=!friendVisible;companion.root.visible=friendVisible;document.getElementById('online').textContent=`Khách đang ở đảo: ${friendVisible?2:1} (mô phỏng)`;document.getElementById('notice').textContent=friendVisible?'❤️ Một nhân vật mô phỏng đã đến. Chưa phải người chơi trực tuyến.':'🌴 Bạn đang khám phá đảo một mình.'};
const fmt=new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',hour12:false});let mode='auto',weatherCode=null,precip=0;let weatherText='Đang chờ dữ liệu';const wc=c=>c===0?'Trời quang':c<=3?'Có mây':c===45||c===48?'Sương mù':[51,53,55,56,57,61,63,65,66,67,80,81,82].includes(c)?'Trời mưa':[95,96,99].includes(c)?'Dông':'Nhiều mây';async function loadWeather(){try{const u='https://api.open-meteo.com/v1/forecast?latitude=21.0285&longitude=105.8542&current=weather_code,precipitation&timezone=Asia%2FHo_Chi_Minh';const res=await fetch(u);if(!res.ok)throw Error('weather');const d=await res.json();weatherCode=d.current.weather_code;precip=d.current.precipitation;weatherText=wc(weatherCode)+' (Hà Nội, cập nhật trực tuyến)';}catch(e){weatherText='Không lấy được dữ liệu Hà Nội; đang dùng thời tiết mặc định';weatherCode=1}}loadWeather();setInterval(loadWeather,15*60*1000);document.getElementById('weatherBtn').onclick=()=>{mode=mode==='auto'?'rain':mode==='rain'?'clear':'auto';document.getElementById('notice').textContent=mode==='auto'?'🌤 Trở về thời tiết Hà Nội':mode==='rain'?'🌧 Đang thử hiệu ứng mưa':'☀️ Đang thử hiệu ứng nắng'};
const rainGeo=new THREE.BufferGeometry(),rainCount=550,ra=new Float32Array(rainCount*3);for(let i=0;i<rainCount;i++){ra[i*3]=(Math.random()-.5)*65;ra[i*3+1]=Math.random()*22;ra[i*3+2]=(Math.random()-.5)*65}rainGeo.setAttribute('position',new THREE.BufferAttribute(ra,3));const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:'#c9e6ff',size:.1,transparent:true,opacity:.65}));scene.add(rain);
let last=performance.now(),walk=0;function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.05);last=now;const parts=fmt.format(new Date()).split(':');const hr=Number(parts[0])+Number(parts[1])/60;const daylight=Math.max(.08,Math.min(1,(hr-5.2)/1.6,(19-hr)/1.6));const isRain=mode==='rain'||mode==='auto'&&([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(weatherCode));sun.intensity=(.28+daylight*3)*(isRain?.45:1);ambient.intensity=.4+daylight*1.8;scene.background=new THREE.Color(daylight>.3?isRain?'#87949b':'#8cd3e8':'#142449');scene.fog=new THREE.Fog(scene.background,70,180);rain.visible=isRain;if(isRain){for(let i=0;i<rainCount;i++){ra[i*3+1]-=dt*19;if(ra[i*3+1]<0){ra[i*3+1]=20;ra[i*3]=player.root.position.x+(Math.random()-.5)*55;ra[i*3+2]=player.root.position.z+(Math.random()-.5)*55}}rainGeo.attributes.position.needsUpdate=true}
let x=Number(keys.has('d')||keys.has('D')||keys.has('ArrowRight'))-Number(keys.has('a')||keys.has('A')||keys.has('ArrowLeft'));let z=Number(keys.has('s')||keys.has('S')||keys.has('ArrowDown'))-Number(keys.has('w')||keys.has('W')||keys.has('ArrowUp'));if(x||z){const len=Math.hypot(x,z);x/=len;z/=len;const dx=(x*Math.cos(camAngle)-z*Math.sin(camAngle))*dt*5,dz=(x*Math.sin(camAngle)+z*Math.cos(camAngle))*dt*5;const nx=player.root.position.x+dx,nz=player.root.position.z+dz;if(Math.hypot(nx,nz)<44){player.root.position.x=nx;player.root.position.z=nz}player.root.rotation.y=Math.atan2(dx,dz);walk+=dt*11;player.legs.forEach((l,i)=>l.rotation.x=Math.sin(walk+i*Math.PI)*.45);player.arms.forEach((a,i)=>a.rotation.x=Math.sin(walk+i*Math.PI)*-.4)}else {player.legs.forEach(l=>l.rotation.x*=.85);player.arms.forEach(a=>a.rotation.x*=.85)}
lanterns.forEach(l=>l.intensity=daylight<.4?1.5:.12);glow.forEach(l=>l.intensity=daylight<.4?.6:0);water.material.opacity=.8+Math.sin(now*.0006)*.06;const p=player.root.position;let target=new THREE.Vector3(p.x,p.y+(firstPerson?2.5:1.6),p.z);let desired=firstPerson?new THREE.Vector3(p.x,p.y+2.45,p.z):new THREE.Vector3(p.x+Math.sin(camAngle)*10,p.y+6,p.z+Math.cos(camAngle)*10);camera.position.lerp(desired,.11);camera.lookAt(firstPerson?target.clone().add(new THREE.Vector3(-Math.sin(camAngle)*8,0,-Math.cos(camAngle)*8)):target);player.root.visible=!firstPerson;renderer.render(scene,camera);document.getElementById('clock').textContent='🕒 Hà Nội: '+fmt.format(new Date())+' • '+(daylight>.3?'Ban ngày':'Ban đêm');document.getElementById('weather').textContent='🌦 '+(mode==='auto'?weatherText:mode==='rain'?'Mưa thử nghiệm':'Nắng thử nghiệm')}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
